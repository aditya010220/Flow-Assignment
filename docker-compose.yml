services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - PORT=5000
      - WORKER_INTERNAL_URL=http://worker:4000
      - WORKER_CALLBACK_SECRET=flowlens-internal-worker-secret
    networks:
      - flowlens-net
    depends_on:
      - worker

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      - PORT=4000
      - BACKEND_CALLBACK_URL=http://backend:5000/api/internal/worker/callback
      - WORKER_SECRET=flowlens-internal-worker-secret
    networks:
      - flowlens-net

networks:
  flowlens-net:
    driver: bridge

networks:
  flowlens-net:
    driver: bridge
